[project]
name = "autosub"
version = "0.2.0"
description = "Standalone transcription utility — drag-and-drop audio/video to subtitle files"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "numpy>=1.24",
    "sherpa-onnx>=1.13.4",
    "sherpa-onnx-core>=1.13.4",
]

[project.optional-dependencies]
windows = ["imageio-ffmpeg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pyinstaller>=6.21.0",
]
