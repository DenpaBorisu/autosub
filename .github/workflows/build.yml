name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyQt6 pyinstaller

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download ffmpeg + ffprobe
        shell: pwsh
        run: |
          curl.exe -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
          7z x ffmpeg.zip
          Copy-Item ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .
          Copy-Item ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe .

      - name: Build executable
        shell: cmd
        run: >-
          pyinstaller --onefile --windowed
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          --exclude-module PyQt6.QtNetwork
          --exclude-module PyQt6.QtSql
          --exclude-module PyQt6.QtTest
          --exclude-module PyQt6.QtMultimedia
          --exclude-module PyQt6.QtSvg
          --exclude-module PyQt6.QtSvgWidgets
          --exclude-module PyQt6.QtQml
          --exclude-module PyQt6.QtQuick
          --exclude-module PyQt6.QtQuick3D
          --exclude-module PyQt6.QtQuickWidgets
          --exclude-module PyQt6.QtQuickControls2
          --exclude-module PyQt6.QtWebEngineCore
          --exclude-module PyQt6.QtWebEngineWidgets
          --exclude-module PyQt6.QtWebChannel
          --exclude-module PyQt6.QtWebSockets
          --exclude-module PyQt6.QtDesigner
          --exclude-module PyQt6.QtPrintSupport
          --exclude-module PyQt6.QtBluetooth
          --exclude-module PyQt6.QtConcurrent
          --exclude-module PyQt6.QtHelp
          --exclude-module PyQt6.QtLocation
          --exclude-module PyQt6.QtNfc
          --exclude-module PyQt6.QtPositioning
          --exclude-module PyQt6.QtSensors
          --exclude-module PyQt6.QtSerialPort
          --exclude-module PyQt6.QtSerialBus
          --exclude-module PyQt6.QtTextToSpeech
          --exclude-module PyQt6.QtXml
          --exclude-module PyQt6.QtPdf
          --exclude-module PyQt6.QtPdfWidgets
          --exclude-module PyQt6.QtRemoteObjects
          --exclude-module PyQt6.QtCharts
          --exclude-module PyQt6.QtDataVisualization
          --exclude-module PyQt6.QtStateMachine
          --exclude-module PyQt6.QtShaderTools
          --exclude-module PyQt6.QtOpenGL
          --exclude-module PyQt6.QtOpenGLWidgets
          --exclude-module PyQt6.QtWaylandCompositor
          --name "AutoSub ${{ steps.version.outputs.version }}"
          autosub_gui.py

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist\AutoSub $v.exe" -DestinationPath "AutoSub-$v-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSub-${{ steps.version.outputs.version }}-windows
          path: AutoSub-${{ steps.version.outputs.version }}-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoSub-${{ steps.version.outputs.version }}-windows.zip

  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache patchelf

      - name: Sync Python dependencies
        run: uv sync

      - name: Get version
        id: version
        run: |
          version=$(grep -E '^version = "' pyproject.toml | sed -E 's/^version = "(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: |
          uv run nuitka \
            --onefile \
            --enable-plugin=pyqt6 \
            --remove-output \
            --lto=yes \
            --nofollow-import-to=PyQt6.QtNetwork \
            --nofollow-import-to=PyQt6.QtSql \
            --nofollow-import-to=PyQt6.QtTest \
            --nofollow-import-to=PyQt6.QtMultimedia \
            --nofollow-import-to=PyQt6.QtSvg \
            --nofollow-import-to=PyQt6.QtSvgWidgets \
            --nofollow-import-to=PyQt6.QtQml \
            --nofollow-import-to=PyQt6.QtQuick \
            --nofollow-import-to=PyQt6.QtQuick3D \
            --nofollow-import-to=PyQt6.QtQuickWidgets \
            --nofollow-import-to=PyQt6.QtQuickControls2 \
            --nofollow-import-to=PyQt6.QtWebEngineCore \
            --nofollow-import-to=PyQt6.QtWebEngineWidgets \
            --nofollow-import-to=PyQt6.QtWebChannel \
            --nofollow-import-to=PyQt6.QtWebSockets \
            --nofollow-import-to=PyQt6.QtDesigner \
            --nofollow-import-to=PyQt6.QtPrintSupport \
            --nofollow-import-to=PyQt6.QtBluetooth \
            --nofollow-import-to=PyQt6.QtConcurrent \
            --nofollow-import-to=PyQt6.QtHelp \
            --nofollow-import-to=PyQt6.QtLocation \
            --nofollow-import-to=PyQt6.QtNfc \
            --nofollow-import-to=PyQt6.QtPositioning \
            --nofollow-import-to=PyQt6.QtSensors \
            --nofollow-import-to=PyQt6.QtSerialPort \
            --nofollow-import-to=PyQt6.QtSerialBus \
            --nofollow-import-to=PyQt6.QtTextToSpeech \
            --nofollow-import-to=PyQt6.QtXml \
            --nofollow-import-to=PyQt6.QtPdf \
            --nofollow-import-to=PyQt6.QtPdfWidgets \
            --nofollow-import-to=PyQt6.QtRemoteObjects \
            --nofollow-import-to=PyQt6.QtCharts \
            --nofollow-import-to=PyQt6.QtDataVisualization \
            --nofollow-import-to=PyQt6.QtStateMachine \
            --nofollow-import-to=PyQt6.QtShaderTools \
            --nofollow-import-to=PyQt6.QtOpenGL \
            --nofollow-import-to=PyQt6.QtOpenGLWidgets \
            --nofollow-import-to=PyQt6.QtWaylandCompositor \
            --output-dir=dist \
            --output-filename=AutoSub \
            autosub_gui.py

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir stage
          cp dist/AutoSub "stage/AutoSub-$v"
          chmod +x "stage/AutoSub-$v"
          (cd stage && zip -q "../AutoSub-$v-linux.zip" "AutoSub-$v")

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSub-${{ steps.version.outputs.version }}-linux
          path: AutoSub-${{ steps.version.outputs.version }}-linux.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoSub-${{ steps.version.outputs.version }}-linux.zip

  build-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python dependencies (Python 3.12)
        run: uv sync --python 3.12

      - name: Get version
        id: version
        run: |
          version=$(grep -E '^version = "' pyproject.toml | sed -E 's/^version = "(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: |
          uv run pyinstaller --onefile --name AutoSub \
            --exclude-module PyQt6.QtNetwork \
            --exclude-module PyQt6.QtSql \
            --exclude-module PyQt6.QtTest \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtSvg \
            --exclude-module PyQt6.QtSvgWidgets \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtQuick3D \
            --exclude-module PyQt6.QtQuickWidgets \
            --exclude-module PyQt6.QtQuickControls2 \
            --exclude-module PyQt6.QtWebEngineCore \
            --exclude-module PyQt6.QtWebEngineWidgets \
            --exclude-module PyQt6.QtWebChannel \
            --exclude-module PyQt6.QtWebSockets \
            --exclude-module PyQt6.QtDesigner \
            --exclude-module PyQt6.QtPrintSupport \
            --exclude-module PyQt6.QtBluetooth \
            --exclude-module PyQt6.QtConcurrent \
            --exclude-module PyQt6.QtHelp \
            --exclude-module PyQt6.QtLocation \
            --exclude-module PyQt6.QtNfc \
            --exclude-module PyQt6.QtPositioning \
            --exclude-module PyQt6.QtSensors \
            --exclude-module PyQt6.QtSerialPort \
            --exclude-module PyQt6.QtSerialBus \
            --exclude-module PyQt6.QtTextToSpeech \
            --exclude-module PyQt6.QtXml \
            --exclude-module PyQt6.QtPdf \
            --exclude-module PyQt6.QtPdfWidgets \
            --exclude-module PyQt6.QtRemoteObjects \
            --exclude-module PyQt6.QtCharts \
            --exclude-module PyQt6.QtDataVisualization \
            --exclude-module PyQt6.QtStateMachine \
            --exclude-module PyQt6.QtShaderTools \
            --exclude-module PyQt6.QtOpenGL \
            --exclude-module PyQt6.QtOpenGLWidgets \
            --exclude-module PyQt6.QtWaylandCompositor \
            autosub_gui.py

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir stage
          cp dist/AutoSub "stage/AutoSub-$v"
          chmod +x "stage/AutoSub-$v"
          (cd stage && zip -qy "../AutoSub-$v-macos.zip" "AutoSub-$v")

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSub-${{ steps.version.outputs.version }}-macos
          path: AutoSub-${{ steps.version.outputs.version }}-macos.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoSub-${{ steps.version.outputs.version }}-macos.zip
